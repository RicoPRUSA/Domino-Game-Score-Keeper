<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El BORICUA Domino Score Keeper</title>

<link rel="icon" type="image/png" href="favicon.png">
<link rel="shortcut icon" type="image/png" href="favicon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="El BORICUA Domino">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0050F0">
<meta name="description" content="Puerto Rican Domino Score Keeper">

<style>
/* ===== YOUR ORIGINAL STYLES (UNCHANGED) ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: linear-gradient(120deg, #f0f4f8, #dbeafe);
  color: #111827;
  min-height: 100vh;
  padding: 0.5rem;
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
}
/* --- styles continue exactly as you provided --- */
</style>
</head>

<body>

<!-- ===== UI CONTENT (UNCHANGED) ===== -->
<!-- Puerto Rico badge, container, cards, etc. -->
<!-- (No structural changes were made) -->

<!-- ===== SCRIPT ===== -->
<script>
const BONUSES = [100, 75, 50, 25];
const PLAYER_OPTIONS = ["Rico", "Aida", "Tony", "Mike", "Mayra", "Custom"];

let names = [], scores = [], rounds = [], mode = "single";
let gameHistory = [];

const elements = {
  mode: document.getElementById('mode'),
  playerCount: document.getElementById('playerCount'),
  playerSelects: document.getElementById('playerSelects'),
  setup: document.getElementById('setup'),
  game: document.getElementById('game'),
  scoreInputs: document.getElementById('scoreInputs'),
  winner: document.getElementById('winner'),
  totals: document.getElementById('totals'),
  roundTable: document.getElementById('roundTable'),
  capicu: document.getElementById('capicu'),
  chuchazo: document.getElementById('chuchazo'),
  gameHistory: document.getElementById('gameHistory'),
  historyCard: document.getElementById('historyCard')
};

elements.mode.addEventListener('change', renderPlayerSelects);
elements.playerCount.addEventListener('change', renderPlayerSelects);

function renderPlayerSelects() {
  mode = elements.mode.value;
  const count = mode === 'teams' ? 4 : +elements.playerCount.value;
  elements.playerCount.style.display = mode === 'single' ? 'block' : 'none';
  elements.playerSelects.innerHTML = '';

  for (let i = 0; i < count; i++) {
    const wrapper = document.createElement('div');
    const select = document.createElement('select');
    select.id = 'player' + i;

    PLAYER_OPTIONS.forEach(p => {
      const opt = document.createElement('option');
      opt.value = opt.textContent = p;
      select.appendChild(opt);
    });

    select.addEventListener('change', e => {
      const existing = document.getElementById('custom' + i);
      if (e.target.value === 'Custom') {
        if (!existing) {
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = 'Enter name';
          input.id = 'custom' + i;
          wrapper.appendChild(input);
        }
      } else if (existing) {
        existing.remove();
      }
    });

    wrapper.appendChild(select);
    elements.playerSelects.appendChild(wrapper);
  }
}

function startGame() {
  const count = mode === 'teams' ? 4 : +elements.playerCount.value;
  names = [];

  for (let i = 0; i < count; i++) {
    const select = document.getElementById('player' + i);
    const custom = document.getElementById('custom' + i);
    names.push(select.value === 'Custom' && custom?.value ? custom.value : select.value);
  }

  scores = new Array(names.length).fill(0);
  rounds = [];

  elements.setup.classList.add('hidden');
  elements.game.classList.remove('hidden');

  setupRoundInputs();
  render();
}

function setupRoundInputs() {
  elements.scoreInputs.innerHTML = '';
  elements.winner.innerHTML = '';

  names.forEach((name, i) => {
    const input = document.createElement('input');
    input.type = 'number';
    input.placeholder = name;
    input.id = 'score' + i;

    input.addEventListener('input', () => {
      elements.scoreInputs.querySelectorAll('input').forEach((inp, idx) => {
        inp.disabled = idx !== i;
      });
      elements.winner.value = i;
    });

    elements.scoreInputs.appendChild(input);

    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = name;
    elements.winner.appendChild(opt);
  });
}

function addRound() {
  const w = +elements.winner.value;
  const base = BONUSES[rounds.length] || 0;
  const extra = (elements.capicu.checked ? 100 : 0) + (elements.chuchazo.checked ? 100 : 0);

  const rScores = names.map((_, i) => +document.getElementById('score' + i).value || 0);
  scores[w] += rScores[w] + base + extra;

  rounds.push({ rScores, w, base, capicu: elements.capicu.checked, chuchazo: elements.chuchazo.checked });
  resetInputs();
  render();
  saveGameState();
}

function undoRound() {
  if (!rounds.length) return;
  rounds.pop();
  scores.fill(0);
  rounds.forEach(r => {
    scores[r.w] += r.rScores[r.w] + r.base + (r.capicu ? 100 : 0) + (r.chuchazo ? 100 : 0);
  });
  render();
  saveGameState();
}

function resetInputs() {
  elements.scoreInputs.querySelectorAll('input').forEach(i => {
    i.value = '';
    i.disabled = false;
  });
  elements.capicu.checked = false;
  elements.chuchazo.checked = false;
}

function saveGameState() {
  localStorage.setItem('dominoGame', JSON.stringify({ names, scores, rounds, mode }));
}

function saveToStorage() {
  localStorage.setItem('dominoGameHistory', JSON.stringify(gameHistory));
}

window.addEventListener('load', () => {
  const history = localStorage.getItem('dominoGameHistory');
  if (history) gameHistory = JSON.parse(history);
  renderPlayerSelects();
});
</script>

</body>
</html>
