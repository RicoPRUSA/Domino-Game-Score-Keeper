<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El BORICUA Domino Score Keeper</title>

<meta name="description" content="Puerto Rican Domino Score Keeper">
<meta name="theme-color" content="#0050F0">

<!-- SVG favicon (GitHub Pages safe) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 600'%3E%3Crect width='900' height='600' fill='%23ffffff'/%3E%3Crect width='900' height='120' y='0' fill='%23ED0000'/%3E%3Crect width='900' height='120' y='120' fill='%23ffffff'/%3E%3Crect width='900' height='120' y='240' fill='%23ED0000'/%3E%3Crect width='900' height='120' y='360' fill='%23ffffff'/%3E%3Crect width='900' height='120' y='480' fill='%23ED0000'/%3E%3Cpath d='M 0 0 L 360 300 L 0 600 Z' fill='%230050F0'/%3E%3Cpath d='M 130 270 L 150 330 L 215 330 L 165 365 L 185 425 L 130 385 L 75 425 L 95 365 L 45 330 L 110 330 Z' fill='%23ffffff'/%3E%3C/svg%3E">

<!-- Apple PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="El BORICUA Domino">

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:linear-gradient(120deg,#f0f4f8,#dbeafe);color:#111827;min-height:100vh;padding:.5rem;-webkit-text-size-adjust:100%;touch-action:manipulation;}
.container{max-width:760px;margin:0 auto;position:relative;}
.pr-flag-badge{position:fixed;bottom:1rem;right:1rem;width:60px;height:60px;border-radius:50%;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:1000;overflow:hidden;border:3px solid white;}
.pr-flag-badge svg{width:100%;height:100%;}
.logo-block{display:flex;flex-direction:column;align-items:center;margin-bottom:1rem;}
.domino-icon{width:50px;height:85px;transform:rotate(-18deg);filter:drop-shadow(2px 4px 10px rgba(0,0,0,.5));}
h1{color:#1e3a8a;text-align:center;margin:.5rem 0;font-size:2rem;text-shadow:0 2px 4px rgba(0,0,0,.4);}
.pr-accent{width:120px;height:4px;margin:.4rem auto .8rem;border-radius:3px;background:linear-gradient(to right,#b91c1c,#fff,#1e3a8a);background-size:200% 100%;animation:shine 3s linear infinite;}
@keyframes shine{0%,100%{background-position:0% 0%}50%{background-position:100% 0%}}
.card{background:white;border-radius:16px;padding:1.5rem;margin-bottom:1rem;box-shadow:0 8px 20px rgba(0,0,0,.15);position:relative;}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(to right,#1e3a8a,#fff,#b91c1c);}
h2{color:#1e3a8a;text-align:center;margin-bottom:1rem;font-size:1.5rem;text-shadow:0 2px 4px rgba(0,0,0,.4);}
.controls{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center;margin-bottom:1rem;}
select,button{padding:.75rem 1.25rem;font-size:1rem;border-radius:8px;border:none;font-weight:600;cursor:pointer}
select{background:#dc2626;color:white}
button{background:#1e40af;color:white}
button.secondary{background:#475569}
input[type="text"],input[type="number"]{padding:.75rem;font-size:1rem;border:2px solid #94a3b8;border-radius:8px;text-align:center;width:80px}
table{width:100%;border-collapse:collapse}
th,td{padding:.75rem .5rem;text-align:center;color:#1e3a8a}
tbody tr{border-top:1px solid #e2e8f0}
.badge{display:inline-block;padding:.25rem .6rem;border-radius:6px;font-size:.75rem;font-weight:700;color:white}
.bonus{background:#f59e0b}
.capicu{background:#ea580c}
.chuchazo{background:#dc2626}
.scores-display{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center}
.score{font-size:1.5rem;font-weight:700;color:#1e3a8a}
.score.winner{color:#dc2626;font-size:1.75rem}
.hidden{display:none}
</style>
</head>

<body>
<div class="pr-flag-badge">
<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
<rect width="900" height="600" fill="#ffffff"/>
<rect width="900" height="120" y="0" fill="#ED0000"/>
<rect width="900" height="120" y="120" fill="#ffffff"/>
<rect width="900" height="120" y="240" fill="#ED0000"/>
<rect width="900" height="120" y="360" fill="#ffffff"/>
<rect width="900" height="120" y="480" fill="#ED0000"/>
<path d="M 0 0 L 360 300 L 0 600 Z" fill="#0050F0"/>
<path d="M 130 270 L 150 330 L 215 330 L 165 365 L 185 425 L 130 385 L 75 425 L 95 365 L 45 330 L 110 330 Z" fill="#ffffff"/>
</svg>
</div>

<div class="container">
<div class="logo-block">
<h1>El BORICUA Domino Score Keeper ¡Wepa!</h1>
<div class="pr-accent"></div>
</div>

<div id="setup" class="card">
<h2>Game Setup</h2>
<div class="controls">
<select id="playerCount">
<option value="2">2 Players</option>
<option value="3">3 Players</option>
<option value="4" selected>4 Players</option>
</select>
<button onclick="startGame()">¡Dale! Start Game</button>
</div>
</div>

<div id="game" class="hidden">
<div class="card">
<h2>Total Scores</h2>
<div id="totals" class="scores-display"></div>
</div>
<button class="secondary" onclick="newGame()">New Game</button>
</div>
</div>

<script>
let names=[],scores=[];
const totals=document.getElementById("totals");
const setup=document.getElementById("setup");
const game=document.getElementById("game");

function startGame(){
const count=+document.getElementById("playerCount").value;
names=[];
for(let i=0;i<count;i++) names.push("Player "+(i+1));
scores=new Array(count).fill(0);
setup.classList.add("hidden");
game.classList.remove("hidden");
render();
}

function render(){
totals.innerHTML=names.map((n,i)=>`<div class="score">${n}: ${scores[i]}</div>`).join("");
}

function newGame(){
setup.classList.remove("hidden");
game.classList.add("hidden");
}
</script>

</body>
</html>
